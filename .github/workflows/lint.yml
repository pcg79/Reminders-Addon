name: Lint

# Runs luacheck (see .luacheckrc) on every push and PR to catch accidental
# globals, undefined references, and syntax errors.
on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        # The addon's own Lua lives at the repo root; checking *.lua avoids
        # recursing into Libs/ (bundled Ace3) regardless of exclude handling.
        run: luacheck *.lua
