name: Package and release

# Runs whenever a tag is pushed (e.g. `git push origin v12.3.0`) and uses the
# BigWigs packager to build the addon zip and publish a GitHub release for it.
on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and create the GitHub release
        uses: BigWigsMods/packager@v2
        env:
          # Provided automatically by GitHub; lets the packager create a
          # GitHub release with the packaged .zip attached.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: CurseForge upload is handled by the existing GitHub -> CF
          # integration that fires when the release is created, so do NOT add a
          # CF_API_KEY secret here or it would upload to CurseForge twice.
          # To also publish to WoWInterface / Wago, add these repo secrets:
          # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
